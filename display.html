<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b25"><title>شاشة إيرادات مركز غيم</title><link rel="stylesheet" href="style.css"><style>body{background:#102b25;color:#fff}.display-wrap{max-width:1300px;margin:auto;padding:5vh 4vw}.display-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.display-brand{display:flex;gap:14px;align-items:center}.display-brand .brand-mark{background:#d9b875;color:#102b25;width:58px;height:58px;font-size:32px}.display-head h1{font-size:clamp(25px,3vw,42px);margin:0}.display-head p{color:#b5ccc2;margin:4px 0}.display-time{color:#c4d6cd}.display-total{margin:5vh 0 25px;padding:30px;border:1px solid #41675a;background:#183d32;border-radius:25px}.display-total span{color:#bed4c9}.display-total strong{display:block;font-size:clamp(38px,7vw,78px);color:#e3c98d;margin-top:10px}.display-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.display-card{background:#17372f;border:1px solid #35584b;border-radius:20px;padding:22px}.display-card span{color:#b8cec3}.display-card b{display:block;font-size:clamp(20px,3vw,34px);margin-top:13px}.display-footer{margin-top:35px;color:#a7c0b4;display:flex;justify-content:space-between;gap:12px;font-size:12px}@media(max-width:700px){.display-cards{grid-template-columns:repeat(2,1fr)}.display-wrap{padding:25px 16px}.display-total{padding:23px}.display-head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="display-wrap"><header class="display-head"><div class="display-brand"><span class="brand-mark">غ</span><div><h1>مركز غيم</h1><p>لوحة عرض الإيرادات اليومية</p></div></div><div id="displayTime" class="display-time"></div></header><section class="display-total"><span>إجمالي الإيرادات المسجلة</span><strong id="total">—</strong><span id="period">تحديث البيانات…</span></section><section class="display-cards"><article class="display-card"><span>عدد الطلاب / الفواتير</span><b id="students">—</b></article><article class="display-card"><span>الشبكة</span><b id="network">—</b></article><article class="display-card"><span>التحويل البنكي</span><b id="transfer">—</b></article><article class="display-card"><span>قرة</span><b id="qara">—</b></article><article class="display-card"><span>نقدًا</span><b id="cash">—</b></article></section><footer class="display-footer"><span>مركز غيم © <span id="year"></span></span><span>شاشة عرض فقط • لا تتضمن أدوات تعديل</span></footer></main><script>const API_URL='';const DISPLAY_KEY=new URLSearchParams(location.search).get('key')||'';const fmt=n=>(Number(n)||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س';async function update(){if(!API_URL){document.getElementById('period').textContent='يلزم إضافة رابط Apps Script في display.html';return}if(!DISPLAY_KEY){document.getElementById('period').textContent='افتح رابط شاشة العرض الخاص بالمركز';return}try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publicDisplay',displayKey:DISPLAY_KEY})});const j=await r.json();if(!j.ok)throw Error(j.error||'تعذر تحميل البيانات');const d=j.data;for(const k of ['total','students','network','transfer','qara','cash'])document.getElementById(k).textContent=k==='students'?Number(d[k]||0).toLocaleString('ar-SA'):fmt(d[k]);document.getElementById('period').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}catch(e){document.getElementById('period').textContent='تعذر تحميل البيانات. تحقق من إعدادات الربط.'}}function tick(){document.getElementById('displayTime').textContent=new Date().toLocaleString('ar-SA',{weekday:'long',hour:'2-digit',minute:'2-digit'});}document.getElementById('year').textContent=new Date().getFullYear();tick();update();setInterval(tick,30000);setInterval(update,60000);</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b25"><title>شاشة إيرادات مركز غيم</title><link rel="stylesheet" href="style.css?v=riyal-font-fix-20261029"><style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap");
:root{color-scheme:dark;--night:#071f1a;--panel:#10382d;--panel2:#164638;--stroke:rgba(180,224,201,.16);--muted:#a6c4b5;--gold:#efd28d;--white:#f7fbf8}
*{box-sizing:border-box}
html{min-height:100%;background:var(--night);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -10%,rgba(38,128,92,.24),transparent 38%),linear-gradient(180deg,#0a2b22 0%,#071f1a 100%);color:var(--white);font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.display-wrap{width:min(1240px,100%);margin:auto;padding:clamp(18px,4vw,48px)}
.display-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:clamp(24px,4vw,42px)}
.display-brand{display:flex;gap:13px;align-items:center;min-width:0}
.display-brand .brand-mark{display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#f3d998,#d4ae60);color:#10352a;width:clamp(46px,5vw,60px);height:clamp(46px,5vw,60px);border-radius:18px;font-size:30px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.display-brand h1{font-size:clamp(23px,3.2vw,39px);font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.35}
.display-brand p{color:var(--muted);font-size:clamp(11px,1.4vw,14px);margin:3px 0 0}
.display-time{text-align:left;color:#d1e2d8;font-size:12px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);border-radius:13px;padding:9px 13px;white-space:nowrap}
.display-total{position:relative;isolation:isolate;overflow:hidden;text-align:center;margin:0 0 20px;padding:clamp(24px,5vw,54px);border:1px solid rgba(231,202,130,.25);background:radial-gradient(ellipse at 0% 100%,rgba(226,190,107,.10),transparent 44%),linear-gradient(135deg,#174b3b,#10382d 65%,#0d3027);border-radius:clamp(22px,3vw,32px);box-shadow:0 22px 55px rgba(0,0,0,.14)}
.display-total:after{content:'غ';position:absolute;z-index:-1;left:1%;bottom:-42%;font-size:clamp(160px,25vw,310px);font-weight:900;line-height:1;color:rgba(255,255,255,.025);pointer-events:none}
.display-total>span{display:block;color:#c5dcd0;font-size:clamp(12px,1.5vw,16px);font-weight:600}
.riyal-sign{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","Arial Unicode MS",sans-serif;font-weight:400;display:inline-block;line-height:1;vertical-align:baseline;unicode-bidi:isolate}.display-total strong{display:block;overflow-wrap:anywhere;font-size:clamp(37px,7vw,80px);line-height:1.25;letter-spacing:-1px;color:var(--gold);font-weight:800;margin:12px 0 0;font-variant-numeric:tabular-nums}
.display-total .total-words{display:block;width:fit-content;max-width:100%;margin:19px auto 0;padding:11px 17px;border:1px solid rgba(239,210,141,.24);border-radius:14px;background:rgba(239,210,141,.10);color:#f7e5b6;font-weight:700;font-size:clamp(13px,1.7vw,19px);line-height:1.9}
#period{display:block;text-align:center;margin-top:17px;color:#a9c8b8;font-size:11px}
.display-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.display-card{position:relative;min-width:0;overflow:hidden;background:linear-gradient(145deg,rgba(22,70,55,.94),rgba(13,49,39,.96));border:1px solid var(--stroke);border-radius:20px;padding:clamp(17px,2.3vw,25px);box-shadow:0 10px 25px rgba(0,0,0,.07);transition:transform .2s,border-color .2s}
.display-card:before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,#efd28d,#4b9f7b);opacity:.9}
.display-card span{display:block;color:#b8d1c4;font-size:clamp(11px,1.25vw,13px);font-weight:600}
.display-card b{display:block;overflow-wrap:anywhere;font-size:clamp(20px,2.5vw,32px);font-weight:800;color:#fff;margin-top:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.display-footer{margin-top:30px;padding:18px 2px 0;border-top:1px solid var(--stroke);color:#8fb2a0;display:flex;justify-content:space-between;gap:12px;font-size:11px}
@media(max-width:800px){.display-wrap{padding:23px 17px 28px}.display-head{align-items:flex-start}.display-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.display-card{border-radius:17px}.display-total{margin-bottom:13px}.display-footer{margin-top:23px}}
@media(max-width:520px){body{font-size:13px}.display-wrap{padding:calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}.display-head{gap:10px;margin-bottom:22px}.display-brand{gap:10px}.display-brand .brand-mark{width:45px;height:45px;border-radius:14px;font-size:25px}.display-brand h1{font-size:23px}.display-brand p{font-size:10px;line-height:1.6}.display-time{font-size:10px;padding:7px 9px;border-radius:11px;max-width:125px;white-space:normal}.display-total{padding:23px 19px 21px;border-radius:23px}.display-total>span{font-size:12px}.display-total strong{font-size:clamp(36px,10.5vw,53px);margin-top:11px;letter-spacing:-.7px}.display-total .total-words{font-size:13px;padding:9px 11px;margin-top:15px;border-radius:12px;line-height:1.85}#period{font-size:10px;margin-top:13px}.display-cards{gap:10px}.display-card{padding:16px 14px;border-radius:16px;min-height:112px}.display-card span{font-size:11px;line-height:1.6}.display-card b{font-size:clamp(18px,5.5vw,25px);margin-top:9px}.display-footer{font-size:10px;line-height:1.7;flex-direction:column;gap:4px;margin-top:20px;padding-top:15px}}
@media(max-width:360px){.display-wrap{padding-inline:10px}.display-time{max-width:105px}.display-brand h1{font-size:21px}.display-total{padding:20px 15px}.display-total strong{font-size:35px}.display-card{padding:14px 11px}.display-card b{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main class="display-wrap"><header class="display-head"><div class="display-brand"><span class="brand-mark">غ</span><div><h1>مركز غيم</h1><p>لوحة عرض الإيرادات اليومية</p></div></div><div id="displayTime" class="display-time"></div></header><section class="display-total"><span>إجمالي الإيرادات المسجلة</span><strong id="total">—</strong><div id="totalWords" class="total-words">جارٍ تحويل الإجمالي إلى كتابة…</div><div id="period">تحديث البيانات…</div></section><section class="display-cards"><article class="display-card"><span>عدد الطلاب / الفواتير</span><b id="students">—</b></article><article class="display-card"><span>التحويل البنكي</span><b id="transfer">—</b></article><article class="display-card"><span>الشبكة</span><b id="network">—</b></article><article class="display-card"><span>قرة</span><b id="qara">—</b></article></section><footer class="display-footer"><span>مركز غيم © <span id="year"></span></span><span>شاشة عرض فقط • لا تتضمن أدوات تعديل</span></footer></main><script>const API_URL='https://script.google.com/macros/s/AKfycbyQbd5XVHAffBcnXW3WbIUdLAzwTjm45evzRxMqsUDVjp5U3NMXEr6DsqWTbglPXdkzaA/exec';const DISPLAY_KEY=new URLSearchParams(location.search).get('key')||'';const fmt=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' <span class="riyal-sign">&#x20C1;</span>';
function amountInArabicWords(value){
  let n=Math.round((Number(value)||0)*100)/100;
  if(n<0)return 'سالب '+amountInArabicWords(-n);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
  const teens=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function under1000(x){
    const parts=[];const h=Math.floor(x/100),r=x%100;
    if(h)parts.push(hundreds[h]);
    if(r>=10&&r<20)parts.push(teens[r-10]);
    else {const u=r%10,t=Math.floor(r/10);if(u&&t)parts.push(ones[u]+' و'+tens[t]);else if(u)parts.push(ones[u]);else if(t)parts.push(tens[t]);}
    return parts.join(' و');
  }
  function group(x,one,two,plural){
    if(x===0)return '';
    if(x===1)return one;
    if(x===2)return two;
    if(x>=3&&x<=10)return under1000(x)+' '+plural;
    return under1000(x)+' '+one;
  }
  const whole=Math.floor(n), halalas=Math.round((n-whole)*100);
  if(whole===0 && halalas===0)return 'صفر ريال سعودي فقط لا غير';
  const scales=[{v:1e9,one:'مليار',two:'ملياران',plural:'مليارات'},{v:1e6,one:'مليون',two:'مليونان',plural:'ملايين'},{v:1e3,one:'ألف',two:'ألفان',plural:'آلاف'}];
  let rest=whole;const parts=[];
  for(const s of scales){const q=Math.floor(rest/s.v);rest%=s.v;if(q)parts.push(group(q,s.one,s.two,s.plural));}
  if(rest)parts.push(under1000(rest));
  let words=parts.join(' و');
  words += (whole===1?' ريال سعودي':whole===2?' ريالان سعوديان':' ريال سعودي');
  if(halalas)words+=' و'+under1000(halalas)+(halalas===1?' هللة':halalas===2?' هللتان':' هللة') ;
  return words+' فقط لا غير';
}
async function update(){if(!API_URL){document.getElementById('period').textContent='يلزم إضافة رابط Apps Script في display.html';return}if(!DISPLAY_KEY){document.getElementById('period').textContent='افتح رابط شاشة العرض الخاص بالمركز';return}try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publicDisplay',displayKey:DISPLAY_KEY})});const j=await r.json();if(!j.ok)throw Error(j.error||'تعذر تحميل البيانات');const d=j.data;for(const k of ['total','students','transfer','network','qara'])if(k==='students')document.getElementById(k).textContent=Number(d[k]||0).toLocaleString('en-US');else document.getElementById(k).innerHTML=fmt(d[k]);document.getElementById('totalWords').textContent=amountInArabicWords(d.total);document.getElementById('period').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}catch(e){document.getElementById('period').textContent='تعذر تحميل البيانات. تحقق من إعدادات الربط.'}}function tick(){document.getElementById('displayTime').textContent=new Date().toLocaleString('ar-SA',{weekday:'long',hour:'2-digit',minute:'2-digit'});}document.getElementById('year').textContent=new Date().getFullYear();tick();update();setInterval(tick,30000);setInterval(update,10000);</script></body></html>
